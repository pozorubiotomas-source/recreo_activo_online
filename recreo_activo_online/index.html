<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recreo Activo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#14213d}header{background:linear-gradient(135deg,#0b2d5c,#2563eb);color:#fff;padding:18px 18px 22px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:66px;height:66px;border-radius:50%;background:#fff}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;opacity:.9}.wrap{max-width:760px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;position:sticky;top:0;z-index:5;background:#f4f7fb;padding:10px 0}.tabs button{flex:1;border:0;border-radius:12px;padding:11px 4px;font-weight:700;color:#174ea6;background:#e7efff}.tabs button.active{background:#2563eb;color:#fff}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #102a430d}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#64748b;font-size:14px}.badge{display:inline-block;background:#e0f2fe;color:#075985;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#e2e8f0;color:#334155}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;margin:7px 0 13px;font-size:15px}label{font-size:14px;font-weight:700}.hidden{display:none!important}.center{text-align:center}.logoBig{width:120px;border-radius:50%}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;margin:10px 0}.success{background:#dcfce7;color:#166534}.people{font-size:13px;margin-top:10px;color:#475569}.empty{text-align:center;padding:30px;color:#64748b}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.smallbtn{padding:8px 10px;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:#fff;max-width:430px;width:100%;border-radius:20px;padding:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;display:none}
</style></head><body>
<header><div class="brand"><img src="logo.png"><div><h1>Recreo Activo</h1><p>Tu recreo, tu actividad.</p></div></div></header>
<div class="wrap">
<div id="auth" class="card center"><img src="logo.png" class="logoBig"><h2>Únete a Recreo Activo</h2><p class="muted">Conecta con tus compañeros y organiza actividades durante los recreos.</p><div id="authMsg"></div><input id="email" type="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña"><div class="row"><button class="btn primary" onclick="login()">Iniciar sesión</button><button class="btn ghost" onclick="signup()">Crear cuenta</button></div></div>
<div id="app" class="hidden">
<div class="tabs"><button id="tHome" onclick="show('home')">🏠 Inicio</button><button id="tCreate" onclick="show('create')">➕ Crear</button><button id="tMine" onclick="show('mine')">👤 Mis actividades</button><button onclick="logout()">🚪 Salir</button></div>
<section id="home" class="screen"><div class="topline"><h2>Actividades</h2><button class="btn ghost smallbtn" onclick="loadActivities()">↻ Actualizar</button></div><div id="list"></div></section>
<section id="create" class="screen"><h2>Crear actividad</h2><div class="card"><label>Nombre</label><input id="name" placeholder="Ej: Partido de fútbol"><label>Tipo</label><select id="type"><option>⚽ Deporte</option><option>🎮 Juego</option><option>🏆 Torneo</option><option>🎨 Otra actividad</option></select><label>Horario</label><input id="time" placeholder="Ej: Recreo 11:30"><label>Lugar</label><input id="place" placeholder="Ej: Cancha del colegio"><label>Cupos</label><input id="spots" type="number" min="2" value="10"><button class="btn primary" onclick="createActivity()">Publicar actividad</button></div></section>
<section id="mine" class="screen"><h2>Mis actividades</h2><div id="mineList"></div><div class="card"><h3>Mi perfil</h3><input id="profileName" placeholder="Nombre"><input id="profileCourse" placeholder="Curso, ej. 4°A"><button class="btn primary" onclick="saveProfile()">Guardar perfil</button></div></section>
</div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://bwgpvgezumvyrxbkqrbe.supabase.co';
const SUPABASE_KEY='sb_publishable_BUjZB9Q60WsgiRkWrRUrsw_98SunFRd';
const configured=!SUPABASE_URL.startsWith('PEGA_')&&!SUPABASE_KEY.startsWith('PEGA_');
let sb=null, user=null, activities=[];
if(configured) sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
function toast(m){let x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function msg(m,ok=false){document.getElementById('authMsg').innerHTML=`<div class="notice ${ok?'success':''}">${m}</div>`}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');['home','create','mine'].forEach(x=>{let b=document.getElementById('t'+x[0].toUpperCase()+x.slice(1));if(b)b.classList.toggle('active',x===id)});if(id==='home')loadActivities();if(id==='mine')loadMine()}
async function signup(){
  if(!configured)return msg('Primero configura Supabase en este archivo.');

  let email=document.getElementById('email').value.trim();
  let password=document.getElementById('password').value;

  if(!email || password.length<6)
    return msg('Usa un correo y una contraseña de al menos 6 caracteres.');

  msg('Creando cuenta...');

  try{
    let {data,error}=await sb.auth.signUp({email,password});

    if(error){
      msg('Error: '+error.message);
      return;
    }

    if(!data.user){
      msg('No se pudo crear el usuario.');
      return;
    }

    await sb.from('profiles').upsert({
      id:data.user.id,
      name:email.split('@')[0],
      course:''
    });

    msg('Cuenta creada correctamente. Ahora intenta iniciar sesión.',true);

  }catch(e){
    msg('Error: '+e.message);
  }
}
async function login(){if(!configured)return msg('Primero configura Supabase en este archivo.');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return msg(error.message);user=data.user;enterApp()}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
async function enterApp(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('home');loadProfile()}
async function createActivity(){let name=document.getElementById('name').value.trim();if(!name)return toast('Escribe un nombre.');let row={creator_id:user.id,name,type:document.getElementById('type').value,time:document.getElementById('time').value||'Por definir',place:document.getElementById('place').value||'Por definir',spots:Math.max(2,Number(document.getElementById('spots').value)||10)};let {error}=await sb.from('activities').insert(row);if(error)return toast(error.message);['name','time','place'].forEach(id=>document.getElementById(id).value='');toast('Actividad publicada');show('home')}
function card(a){
  let mine=(a.participants||[]).some(p=>p.user_id===user.id);
  let full=(a.participants||[]).length>=a.spots;
  let creator=a.profiles?.name||'Usuario';
  let isCreator=a.creator_id===user.id;

  return `<div class="card">
    <div class="row">
      <div>
        <span class="badge">${esc(a.type)}</span>
        <h3>${esc(a.name)}</h3>
      </div>
      <strong>${(a.participants||[]).length}/${a.spots}</strong>
    </div>

    <p>🕒 ${esc(a.time)} · 📍 ${esc(a.place)}</p>
    <p class="muted">Creado por ${esc(creator)}</p>

    <div class="people">
      ${(a.participants||[]).map(p=>esc(p.profiles?.name||'Usuario')).join(', ')}
    </div>

    <br>

    ${isCreator
      ? `<button class="btn danger" onclick="removeActivity('${a.id}')">Eliminar</button>`
      : mine
        ? `<button class="btn ghost" onclick="leave('${a.id}')">Salir</button>`
        : `<button class="btn primary" ${full?'disabled':''} onclick="join('${a.id}')">${full?'Sin cupos':'Unirme'}</button>`
    }
    </div>`;
}

function renderActivities(){
  const list=document.getElementById('list');

  if(!activities || activities.length===0){
    list.innerHTML='<div class="empty">No hay actividades todavía.</div>';
    return;
  }

  list.innerHTML=activities.map(card).join('');
}

async function loadActivities(){let {data,error}=await sb.from('activities').select('*,profiles!activities_creator_id_fkey(name,course),participants(activity_id,user_id,profiles!participants_user_id_fkey(name,course))').order('created_at',{ascending:false});if(error)return document.getElementById('list').innerHTML='<div class="notice">'+error.message+'</div>';activities=data||[];renderActivities()}async function leave(id){let {error}=await sb.from('participants').delete().eq('activity_id',id).eq('user_id',user.id);if(error)return toast(error.message);toast('Saliste de la actividad');loadActivities()}
async function removeActivity(id){if(!confirm('¿Eliminar esta actividad?'))return;let {error}=await sb.from('activities').delete().eq('id',id).eq('creator_id',user.id);if(error)return toast(error.message);toast('Actividad eliminada');loadActivities()}
async function loadMine(){let {data,error}=await sb.from('participants').select('activity_id,activities(*,participants(activity_id,user_id,profiles!participants_user_id_fkey(name,course)))').eq('user_id',user.id);if(error)return document.getElementById('mineList').innerHTML='<div class="notice">'+error.message+'</div>';let arr=(data||[]).map(x=>x.activities).filter(Boolean);document.getElementById('mineList').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Todavía no estás inscrito en actividades.</div>';loadProfile()}async function loadProfile(){let {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(data){document.getElementById('profileName').value=data.name||'';document.getElementById('profileCourse').value=data.course||''}}
async function saveProfile(){let {error}=await sb.from('profiles').upsert({id:user.id,name:document.getElementById('profileName').value.trim(),course:document.getElementById('profileCourse').value.trim()});if(error)return toast(error.message);toast('Perfil guardado')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{if(!configured){msg('La app ya está preparada para funcionar online. Falta conectar tu proyecto de Supabase.');return}let {data}=await sb.auth.getSession();if(data.session){user=data.session.user;enterApp()}setInterval(()=>{if(user)loadActivities()},10000)})();
</script></body></html>
